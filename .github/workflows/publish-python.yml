# Trusted publishing (OIDC, no long-lived tokens) for matrix-component on PyPI.
# One-time console setup: PyPI project Settings → Publishing → add GitHub
# identity (owner enrell, workflow file publish-python.yml). Tag to release:
#   git tag sdk-python/v0.1.0 && git push origin sdk-python/v0.1.0
name: publish-python
on:
  push:
    tags: ["sdk-python/v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build sdk-python/ --outdir dist-pypi
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/
