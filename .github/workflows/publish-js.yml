# Trusted publishing (OIDC, no tokens) for matrix-kernel on npm.
# First publish is manual (a nonexistent package has no Settings page);
# OIDC takes over from 0.1.1 on. One-time console setup: npmjs.com
# package Settings → trusted publisher (repo enrell/matrix, this file).
# Tag to release: git tag sdk-js/v0.1.0 && git push origin sdk-js/v0.1.0
name: publish-js
on:
  push:
    tags: ["sdk-js/v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm test
        working-directory: sdk/js
      - run: npm publish --provenance --access public
        working-directory: sdk/js
