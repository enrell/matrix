# Trusted publishing (OIDC, no long-lived keys) for Matrix.Component on NuGet.
# First publish is manual (a nonexistent package has no Settings page);
# OIDC takes over after. One-time console setup: nuget.org package
# Settings → trusted publishing policy (owner enrell, repo matrix,
# workflow file publish-csharp.yml). Flow: NuGet/login@v1 exchanges the
# GitHub OIDC token for a 1-hour API key, then dotnet pushes with it.
# Tag to release: git tag sdk-csharp/v0.1.0 && git push origin sdk-csharp/v0.1.0
name: publish-csharp
on:
  push:
    tags: ["sdk-csharp/v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet pack -c Release
        working-directory: sdk/csharp/src/Matrix.Component
      - uses: NuGet/login@v1
        id: login
        with:
          user: enrell
      - run: dotnet nuget push "bin/Release/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
        working-directory: sdk/csharp/src/Matrix.Component
