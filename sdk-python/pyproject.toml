[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-component"
version = "0.1.0"
description = "Matrix external-component SDK (M8 experimental contract surface)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
authors = [{name = "enrell"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
[tool.setuptools]
py-modules = ["matrix_component", "matrix_operator"]
