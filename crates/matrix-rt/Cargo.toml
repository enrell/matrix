[package]
publish = false
name = "matrix-rt"
version = "0.1.0"
edition = "2021"
description = "Matrix legacy trusted-profile daemon and CLI over a Unix socket"
authors = ["enrell"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/enrell/matrix"
readme = "README.md"

[[bin]]
name = "matrix-rt"
path = "src/main.rs"

[dependencies]
matrix-core = { path = "../matrix-core" }
matrix-host = { path = "../matrix-host" }
serde_json = "1"
