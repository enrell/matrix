[package]
name = "matrix-runtime"
version = "0.1.0"
edition = "2021"
description = "Matrix managed service: SQLite ledger, mutual TLS, leases, routes and public api facade"
authors = ["enrell"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/enrell/matrix"
readme = "README.md"
[dependencies]
matrix-proto = { version = "0.1.0", path = "../matrix-proto" }
matrix-core = { version = "0.1.0", path = "../matrix-core" }
matrix-host = { version = "0.1.0", path = "../matrix-host" }
matrix-guard = { version = "0.1.0", path = "../matrix-guard" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
matrix-component = { version = "0.1.0", path = "../matrix-component" }
